<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10120f">
    <meta name="description" content="Create your FITTRACK account.">
    <title>Create account · FITTRACK</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <script type="module" src="js/auth-page.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="index.html#dashboard" aria-label="FITTRACK dashboard">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M5 18h5l3-9 5 15 3-8h6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">FIT<span>TRACK</span></span>
      </a>
      <section class="panel auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">YOUR FITNESS, YOUR WAY</p>
        <h1 id="auth-title">Create account<span class="heading-period">.</span></h1>
        <p class="auth-description">Your account lets you sync workouts and health logs between devices.</p>
        <p class="auth-config-warning" id="auth-config-warning" role="status" hidden></p>
        <form id="auth-form" data-auth-mode="register" class="auth-form">
          <label for="auth-name">Name</label>
          <input id="auth-name" name="name" type="text" maxlength="60" autocomplete="name" required>
          <label for="auth-email">Email address</label>
          <input id="auth-email" name="email" type="email" maxlength="254" autocomplete="email" required>
          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
          <button class="button button-primary auth-submit" type="submit">Create account</button>
        </form>
        <p class="auth-status" id="auth-status" role="status" aria-live="polite" hidden></p>
        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        <a class="auth-guest-link" href="index.html#dashboard">Continue in guest mode</a>
      </section>
    </main>
  </body>
</html>
